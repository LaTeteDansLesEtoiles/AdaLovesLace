app {
  fsname        = "ada-loves-lace"
  display-name  = "AdaLovesLace"
  version       = "1.0.17"
  vendor        = "Vigilia Patrimonia"
  main-class    = "org.alienlabs.adaloveslace.App"
  inputs        = ["target/AdaLovesLace.jar"]
  vcs-url       = "https://github.com/LaTeteDansLesEtoiles/AdaLovesLace"

  contacts {
    email       = "contact@vigilia-patrimonia.com"
    website     = "https://adaloveslace.top"
  }

  site {
      github.oauth-token    = "env:conveyor"
      github.pages-branch   = "gh-pages"
      base-url              = "https://app.adaloveslace.top"
  }

  # Classe contenant le point d'entrée (main)
  main-class                = "org.alienlabs.adaloveslace.App"

  # JVM embarquée (optionnel : Conveyor la télécharge automatiquement si omise)
  jvm {
    version     = 25
    modules     = ["java.base", "java.desktop", "java.logging"]
  }
}

# ─────────────────────────────────────────────────────────────
# MACOS : Signature + Notarisation (Obligatoire depuis 2024)
# ─────────────────────────────────────────────────────────────
mac {
  signing {
    # Option 1 (Recommandée CI) : Profil Keychain configuré avec `xcrun notarytool`
    keychain-profile        = "CI_APPLE_DEVELOPER_ID"

    # Option 2 (Fallback) : Certificat + mot de passe direct
    # certificate = "env:MAC_CERT_PATH"
    # password    = "env:MAC_CERT_PASSWORD"

    # Notarisation automatique (Apple exige depuis macOS 13)
    notarize = true
    apple-id = "env:APPLE_DEVELOPER_EMAIL"
    apple-id-password = "env:APPLE_APP_SPECIFIC_PASSWORD"
    team-id = "YOUR_10_CHAR_TEAM_ID"
  }
  icon = "packaging/icons/app.icns"
  entitlements = "packaging/macos/entitlements.plist"
}

# ─────────────────────────────────────────────────────────────
# WINDOWS : Signature Authenticode
# ─────────────────────────────────────────────────────────────
windows {
  signing {
    certificate = "env:WIN_CERT_PFX"        # Chemin ou contenu Base64 du .pfx/.p12
    password    = "env:WIN_CERT_PASSWORD"
    # Horodatage obligatoire pour que la signature survive à l'expiration du cert
    timestamp-url = "http://timestamp.digicert.com"
    # timestamp-url = "http://timestamp.sectigo.com"
  }
  icon = "packaging/icons/app.ico"
  menu-shortcut = true
  desktop-shortcut = true
}

# ─────────────────────────────────────────────────────────────
# LINUX : .deb / .rpm / .AppImage
# ─────────────────────────────────────────────────────────────
linux {
  icon = "target/classes/adalogoafinalgros.svg"
  categories = ["Education", "Utility"]
  # La signature GPG est optionnelle (uniquement pour dépôts apt/yum)
  signing { enabled = false }
}

# ─────────────────────────────────────────────────────────────
# OUTPUT
# ─────────────────────────────────────────────────────────────
output-directory                = "target/artifacts"
conveyor.compatibility-level    = 22
conveyor.billing-email          = "contact@vigilia-patrimonia.com"
conveyor.license-key            = AGPL-3.0-or-later
